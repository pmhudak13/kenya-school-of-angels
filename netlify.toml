[build]
  publish = "."

[[redirects]]
  from = "/donate"
  to = "/#donate"
  status = 301

[[redirects]]
  from = "/photos"
  to = "/gallery.html"
  status = 301

[[redirects]]
  from = "/about"
  to = "/#mission"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
